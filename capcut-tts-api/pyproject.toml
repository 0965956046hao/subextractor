[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capcut-tts-api"
version = "1.1.0"
description = "Pure Python SDK + FastAPI gen-voice service for CapCut TTS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "CapCut API Contributors"}
]
keywords = ["capcut", "capcut-tts-api", "tts", "stt", "speech-to-text", "text-to-speech", "vod", "api", "gen-voice", "service"]
dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.scripts]
capcut-tts-api = "capcut_tts_api.cli:main"
capcut-tts-service = "service.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["capcut_tts_api*", "service*"]
