[package]
name = "subtitle-extractor"
version = "0.1.0"
description = "SubTitle Extractor desktop app"
authors = ["SubTitleExtractor"]
edition = "2021"

[lib]
name = "subtitle_extractor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
base64 = "0.22"
